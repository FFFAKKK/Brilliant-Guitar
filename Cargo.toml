[workspace]
members = [
  "crates/brilliant-core-types",
  "crates/brilliant-score-foundation",
  "crates/brilliant-extension-protocol",
  "crates/brilliant-kernel-contracts",
  "crates/brilliant-kernel-runtime",
  "crates/brilliant-kernel-session",
  "crates/brilliant-kernel-node",
]
default-members = [
  "crates/brilliant-core-types",
  "crates/brilliant-score-foundation",
  "crates/brilliant-extension-protocol",
  "crates/brilliant-kernel-contracts",
  "crates/brilliant-kernel-runtime",
  "crates/brilliant-kernel-session",
  "crates/brilliant-kernel-node",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
napi = { version = "=3.12.0", default-features = false }
napi-derive = { version = "=3.6.2", default-features = false, features = ["strict"] }
napi-build = "=2.4.0"
slotmap = "=1.1.1"
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "std", "validate", "deterministic", "portable-dispatch"] }
sha2 = "=0.10.9"
wat = "=1.228.0"

[profile.dev]
panic = "unwind"

[profile.test]
panic = "unwind"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
