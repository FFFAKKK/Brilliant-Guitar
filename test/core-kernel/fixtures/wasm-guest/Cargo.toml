[package]
name = "kernel-scoped-wasm-fixture"
version = "0.1.0"
edition = "2021"
publish = false

# A guest test program, deliberately outside the seven-crate host workspace.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "guest.rs"

[[example]]
name = "scoped_reads_v2"
path = "guest-v2.rs"
crate-type = ["cdylib"]

[dependencies]
brilliant-extension-protocol = { path = "../../../../crates/brilliant-extension-protocol", features = ["scoped-guest-v1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1
