[package]
name = "brilliant-guitar-desktop"
version = "0.1.0"
description = "Desktop host for the score workbench"
edition = "2024"
rust-version = "1.88.0"
publish = false

[lib]
name = "brilliant_guitar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "=1.53.1", features = ["macros", "sync"] }
brilliant-core-types = { path = "../../../crates/brilliant-core-types" }
brilliant-score-foundation = { path = "../../../crates/brilliant-score-foundation" }
brilliant-kernel-contracts = { path = "../../../crates/brilliant-kernel-contracts" }
brilliant-kernel-session = { path = "../../../crates/brilliant-kernel-session" }
tauri-plugin-dialog = "2.7.0"
zeroize = "=1.8.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
windows-sys = { version = "=0.60.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=4.2.0", default-features = false, features = ["v1", "apple-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=4.2.0", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }

# Keep the desktop shell independent from the accepted Core workspace gates.
[workspace]
