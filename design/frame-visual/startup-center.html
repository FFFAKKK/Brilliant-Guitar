<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Brilliant Guitar · 启动中心</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/startup-center-preview.css">
<link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/structure-preview.css">
  <link rel="stylesheet" href="styles/score-view.css">
  <link rel="stylesheet" href="styles/runtime-preview.css">
  <link rel="stylesheet" href="styles/runtime-zoom.css">
  <link rel="stylesheet" href="styles/framework-controls.css">
  <link rel="stylesheet" href="styles/workspace-layout.css">
  <link rel="stylesheet" href="styles/command-menu.css">
  <link rel="stylesheet" href="styles/command-dialog.css">
  <link rel="stylesheet" href="styles/frame-accessibility.css">
  <link rel="stylesheet" href="styles/score-info.css">
  <link rel="stylesheet" href="styles/plugin-startup-preview.css">
  <link rel="stylesheet" href="styles/startup-center-product.css">
</head>
<body class="startup-product">
  <main id="launch-root" class="launch-center" data-frame-ui data-density="compact" aria-label="启动中心">
    <aside class="launch-sidebar" data-frame-ui>
      <div class="launch-brand"><span data-launch-icon="app"></span><span>Brilliant<br>Guitar</span></div>
      <nav class="launch-tabs" role="tablist" aria-label="启动中心页面" aria-orientation="vertical">
        <button id="launch-tab-recent" type="button" role="tab" aria-selected="true" aria-controls="launch-recent" tabindex="0" data-launch-page="recent"><span data-launch-icon="timerReset"></span>最近</button>
        <button id="launch-tab-plugins" type="button" role="tab" aria-selected="false" aria-controls="launch-plugins" tabindex="-1" data-launch-page="plugins"><span data-launch-icon="library"></span>插件</button>
        <button id="launch-tab-settings" type="button" role="tab" aria-selected="false" aria-controls="launch-settings" tabindex="-1" data-launch-page="settings"><span data-launch-icon="settings"></span>设置</button>
      </nav>

    </aside>
    <div class="launch-pages">
      <section id="launch-recent" class="launch-page launch-home" role="tabpanel" aria-labelledby="launch-tab-recent" data-frame-ui>
        <header class="launch-header">
          <h1>最近</h1>
          <div class="launch-actions"><button id="launch-refresh" data-frame-ui type="button" class="launch-icon-button" title="刷新最近作品" aria-label="刷新最近作品"><span data-launch-icon="timerReset"></span></button>
            <button id="launch-new" type="button" class="launch-button" title="新建作品"><span data-launch-icon="plus"></span>新建</button>
            <button id="launch-open" type="button" class="launch-button" title="打开作品"><span data-launch-icon="page"></span>打开</button>
          </div>
        </header>
        <div class="launch-home-content">
          <section class="launch-recents" aria-label="最近作品">
            <label class="launch-search"><span data-launch-icon="search"></span><input id="launch-search" type="search" placeholder="搜索作品" aria-label="搜索作品"></label>
            <div id="launch-file-list" class="launch-file-list"></div>
            <p id="launch-empty" class="launch-empty" hidden>没有匹配的作品</p>

          </section>
          <aside class="launch-preview" aria-label="所选作品">
            <div id="launch-score-card" class="launch-score-card"></div>
            <strong id="launch-preview-title"></strong>
            <span id="launch-preview-meta" class="launch-preview-meta"></span>
            <button id="launch-open-selected" type="button" class="launch-open-selected" aria-label="打开所选作品" title="打开所选作品"><span data-launch-icon="collapseRight"></span></button><button id="launch-remove" data-frame-ui type="button" class="launch-icon-button" title="移除最近记录；不删除文件" aria-label="移除最近记录" hidden><span data-launch-icon="close"></span></button>
          </aside>
        </div>
        <footer class="launch-home-footer"><span id="launch-status" role="status" aria-live="polite"></span><button id="launch-retry" data-frame-ui type="button" class="launch-icon-button" aria-label="重试" hidden><span data-launch-icon="undo"></span></button><button id="launch-continue" data-frame-ui type="button" class="launch-icon-button" title="继续当前作品" aria-label="继续当前作品" hidden><span data-launch-icon="play"></span></button></footer>
      </section>
      <section id="launch-plugins" class="launch-page launch-plugin-page" role="tabpanel" aria-labelledby="launch-tab-plugins" hidden>
        <div id="startup-root" data-frame-ui class="startup-preview" aria-label="备份框架插件启动配置">
    <section class="startup-window" aria-labelledby="startup-title">
      <header class="startup-header">
        <h1 id="startup-title">插件</h1>

        <label class="startup-search"><span data-preview-icon="search"></span><input id="startup-search" type="search" placeholder="搜索插件" aria-label="搜索插件"></label>
        <select id="startup-filter" class="startup-filter" aria-label="筛选下次启动状态">
          <option value="all">全部</option>
          <option value="enabled">启用</option>
          <option value="disabled">停用</option>
        </select>
      </header>
      <div class="startup-content">
        <section id="startup-list" class="startup-list" aria-label="插件列表"></section>
        <aside id="startup-detail" class="startup-detail" aria-label="所选插件详情"></aside>
      </div>
      <footer class="startup-footer">
        <span id="startup-feedback" class="startup-feedback" role="status" aria-live="polite">启停在下次启动生效</span>
        <button id="startup-discard" type="button" class="startup-action" hidden><span data-preview-icon="undo"></span>撤销</button>
        <button id="startup-apply" type="button" class="startup-action startup-action-primary" hidden><span data-preview-icon="check"></span>保存</button>
        <button id="startup-retry" type="button" class="startup-action" title="重新读取配置；成功后撤销当前草稿" aria-label="重新读取配置" hidden><span data-preview-icon="undo"></span></button>
        <button id="startup-open" type="button" class="startup-action" title="用已保存配置启动备份工作区" aria-label="启动备份工作区" hidden><span data-preview-icon="play"></span></button>
      </footer>
    </section>
  </div>
      </section>
      <section id="launch-settings" class="launch-page launch-settings" role="tabpanel" aria-labelledby="launch-tab-settings" data-frame-ui hidden>
        <header class="launch-header"><h1>设置</h1></header>
        <div class="launch-settings-content">
          <h2>界面</h2>
          <div class="launch-setting-row"><label for="launch-density">密度</label><select id="launch-density" aria-label="当前启动中心界面密度"><option value="compact">紧凑</option><option value="comfortable">宽松</option></select></div>
          <div class="launch-setting-row"><label for="launch-font-size">字号</label><select id="launch-font-size" aria-label="当前启动中心字号"><option value="12">12</option><option value="13" selected>13</option><option value="14">14</option></select></div>
          <div class="launch-setting-note"><button id="launch-appearance-status" type="button" class="launch-icon-button" data-frame-ui title="启动中心设置" aria-label="启动中心设置" disabled><span data-launch-icon="info"></span></button></div>
          <div class="launch-about"><span data-launch-icon="app"></span><span>Brilliant Guitar</span></div>
        </div>
      </section>
    </div>
  </main>
  <div id="app" data-frame-ui hidden></div>
  <noscript>请启用 JavaScript 查看交互预览。</noscript>
  <script src="vendor/startup-center-product.js"></script>
</body>
</html>
